<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Invaders iPhone</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            margin: auto;
            max-width: 100vw;
            max-height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100vw;
            color: #fff;
            text-align: center;
            font-size: 18px;
            z-index: 10;
            font-family: Arial, sans-serif;
            pointer-events: none;
        }
        #touch-controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 20;
            pointer-events: none;
        }
        .arrow-btn, .fire-btn {
            width: 80px;
            height: 80px;
            margin: 10px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 40px;
            user-select: none;
            pointer-events: auto;
            border: 2px solid #fff;
        }
        .fire-btn {
            background: rgba(255,255,255,0.35);
            color: #ff0;
            font-size: 44px;
            font-weight: bold;
        }
        #restart-btn {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            background: #222;
            color: #fff;
            font-size: 28px;
            border: 2px solid #fff;
            border-radius: 16px;
            padding: 18px 40px;
            font-family: Arial, sans-serif;
            box-shadow: 0 4px 24px #000a;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .arrow-btn, .fire-btn { width: 60px; height: 60px; font-size: 28px; }
            .fire-btn { font-size: 32px; }
            #restart-btn { font-size: 20px; padding: 12px 24px; }
        }
    </style>
</head>
<body>
    <div id="info">
        Usa le frecce per muovere il cannone. Premi il pulsante centrale per sparare.
        <p> Buona partita da Roberto Micarelli</p>
    </div>
    <div id="touch-controls">
        <div class="arrow-btn" id="left-btn">&#8592;</div>
        <div class="fire-btn" id="fire-btn">&#9679;</div>
        <div class="arrow-btn" id="right-btn">&#8594;</div>
    </div>
    <button id="restart-btn">Rigioca</button>
    <script src="space_iphone.js"></script>
</body>
</html>
