<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Invaders</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
            font-family: Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 100;
        }

        .control-btn {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }

        #orientation-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1000;
            font-size: 24px;
            padding: 20px;
        }

        @media screen and (orientation: portrait) {
            #orientation-message {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="orientation-message">
            Ruota il dispositivo in orizzontale per giocare
        </div>
        <div id="controls">
            <div class="control-btn" id="left-btn">←</div>
            <div class="control-btn" id="shoot-btn">SPACE</div>
            <div class="control-btn" id="right-btn">→</div>
        </div>
    </div>
    <script src="space_invaders.js"></script>
    <script>
        // Controlli touch
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');
        const shootBtn = document.getElementById('shoot-btn');
        
        let isLeftPressed = false;
        let isRightPressed = false;
        
        // Funzioni per i controlli touch
        function setupTouchControls() {
            leftBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isLeftPressed = true;
            });
            
            leftBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                isLeftPressed = false;
            });
            
            rightBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isRightPressed = true;
            });
            
            rightBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                isRightPressed = false;
            });
            
            shootBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameStarted && !gameOver) {
                    bullets.push({
                        x: player.x,
                        y: player.y - player.height/2,
                        speed: 5
                    });
                    playLaserSound();
                }
            });
        }

        // Funzione per il feedback tattile
        function vibrate(duration) {
            if (navigator.vibrate) {
                navigator.vibrate(duration);
            }
        }

        // Modifica la funzione keyPressed per includere i controlli touch
        function keyPressed() {
            if (!gameStarted && (keyCode === 32 || keyCode === 13)) {
                gameStarted = true;
                return;
            }
            
            if (gameOver && (keyCode === 32 || keyCode === 13)) {
                resetGame();
                return;
            }
            
            if (gameStarted && !gameOver) {
                if (keyCode === LEFT_ARROW || isLeftPressed) {
                    playerVelocity = -player.speed;
                } else if (keyCode === RIGHT_ARROW || isRightPressed) {
                    playerVelocity = player.speed;
                } else if (keyCode === 32) {
                    bullets.push({
                        x: player.x,
                        y: player.y - player.height/2,
                        speed: 5
                    });
                    playLaserSound();
                }
            }
        }

        // Inizializza i controlli touch
        setupTouchControls();
    </script>
</body>
</html>
